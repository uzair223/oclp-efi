name: Build OCLP EFI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Install OCLP
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 \
          HOMEBREW_NO_REQUIRE_TAP_TRUST=1 \
            brew install --cask opencore-patcher

      - name: Build EFI
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output"

          cat > watcher.sh <<'EOF'
          #!/bin/bash

          while true; do
            found=$(find /var/folders \
              -path "*/Build-Folder/OpenCore-Build/EFI/OC/config.plist" \
              -print -quit 2>/dev/null)

            if [ -n "$found" ]; then
              src=$(dirname "$(dirname "$(dirname "$found")")")
              echo "Found build:"
              echo "$src"

              rm -rf "$GITHUB_WORKSPACE/output/EFI"
              cp -R "$src/EFI" "$GITHUB_WORKSPACE/output/"

              echo "EFI copied"
              exit 0
            fi

            sleep 0.05
          done
          EOF

          chmod +x watcher.sh

          ./watcher.sh &
          WATCHER=$!

          /Applications/OpenCore-Patcher.app/Contents/MacOS/OpenCore-Patcher \
            --build \
            --model Macmini6,2 \
            --verbose || true

          wait $WATCHER || true

          ls -R "$GITHUB_WORKSPACE/output"

          test -f "$GITHUB_WORKSPACE/output/EFI/BOOT/BOOTx64.efi"
          test -f "$GITHUB_WORKSPACE/output/EFI/OC/OpenCore.efi"
          test -f "$GITHUB_WORKSPACE/output/EFI/OC/config.plist"

      - name: Package EFI
        run: |
          cd output
          zip -r ../Macmini6,2-OCLP-EFI.zip EFI

      - name: Upload EFI
        uses: actions/upload-artifact@v4
        with:
          name: Macmini6,2-OCLP-EFI
          path: Macmini6,2-OCLP-EFI.zip
