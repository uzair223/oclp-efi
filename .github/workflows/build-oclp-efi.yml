name: Build OCLP EFI

on:
  workflow_dispatch:
    inputs:
      model:
        description: Target Mac model
        required: true
        default: Macmini6,2
        type: choice
        options:
          - Macmini6,1
          - Macmini6,2

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Clone OCLP
        run: |
          git clone --depth=1 \
            https://github.com/dortania/OpenCore-Legacy-Patcher.git \
            oclp

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r oclp/requirements.txt

      - name: Build EFI
        env:
          MODEL: ${{ inputs.model }}
        run: |
          cd oclp

          python3 OpenCore-Patcher-GUI.command \
            --build \
            --model "$MODEL" \
            --verbose

          test -f Build-Folder/OpenCore-Build/EFI/BOOT/BOOTx64.efi
          test -f Build-Folder/OpenCore-Build/EFI/OC/OpenCore.efi
          test -f Build-Folder/OpenCore-Build/EFI/OC/config.plist

          find Build-Folder/OpenCore-Build

      - uses: actions/upload-artifact@v4
        with:
          name: OCLP-EFI-${{ inputs.model }}
          path: oclp/Build-Folder/OpenCore-Build
